<!--Realizar una card de proteccion de cuenta-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proteccion</title>
    <!--link a css-->
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="card">
        <div class="emoji">🕵️‍♀️🔒</div>
        <h3>Protect your account</h3>
        <p class="email">email@address.com</p>
        <p>We use your email address if you get locked out of your account or if we notice suspicious activity</p>
        <div class="recovery">
            <h3 class="div2">Recovery email</h3>
            <p>rec-email@address.com</p>
            <button class="boton">Update</button>
        </div>
        <button class="boton2">Confirm</button>
    </div>
</body>
</html>
