<!--08 - Termómetro
index.html debe tener:
una lista desordenada con 10 ítems.
la lista debe ir de Temperatura: 0°C a Temperatura: 50°C aumentando de a 5°C.
poner las temperaturas extremas (0°C y 50°C) en negrita.
dar a cada temperatura un color distinto, cambiando gradualmente, siendo el 0°C el color azul y 50°C el color rojo. Ver ejemplo.-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>termometro</title>
    <!--Link a css-->
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <ul id="termometro">
        <li class="temp50"><strong>50°C</strong></li>
        <li class="temp45">45°C</li>
        <li class="temp40">40°C</li>
        <li class="temp35">35°C</li>
        <li class="temp30">30°C</li>
        <li class="temp25">25°C</li>
        <li class="temp20">20°C</li>
        <li class="temp15">15°C</li>
        <li class="temp10">10°C</li>
        <li class="temp5">5°C</li>
        <li class="temp0"><strong>0°C</strong></li>
    </ul>
</body>
</html>
