<!--
04 - Paisaje
index.html debe tener:

al menos 10 elementos en línea span, que deben contener cada uno un emoji (por ejemplo, de árboles y/o edificios). Por ejemplo:

🌲🌳🌳🏠🏢🏦🏠🏠🌲🌳

cada emoji debe tener un tamaño de letra distinto para que haya variedad entre ellos.-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paisaje</title>
    <!--Link a css-->
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <span id="arbol1">🌲</span>
    <span id="arbol2">🌳</span>
    <span id="arbol3">🌳</span>
    <span id="casa1">🏠</span>
    <span id="edificio1">🏢</span>
    <span id="edificio2">🏦</span>
    <span id="casa2">🏠</span>
    <span id="casa3">🏠</span>
    <span id="arbol4">🌲</span>
    <span id="arbol5">🌳</span>
</body>
</html>
