<!--Generar una card de una verduleria, que contenga un saludo y un selecciona que fruta queres (tiene que contener 4 frutas con sus respectivos emojis)-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verduleria</title>
    <!--link a css-->
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="card">
        <h3>Verduleria</h3>
        <p>👋Hola! seleccioná le fruta que desees.</p>
        <ul class="frutas">
            <li>🍎Manzana</li>
            <li>🍌Banana</li>
            <li>🍑Durazno</li>
            <li>🍓Frutilla</li>
        </ul>
    </div>
</body>
</html>
